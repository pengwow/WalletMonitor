[project]
name = "wallet-monitor-plugin"
version = "1.0.0"
description = "多链区块链钱包监控系统 QuantCell 插件"
authors = [{ name = "WalletMonitor Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
